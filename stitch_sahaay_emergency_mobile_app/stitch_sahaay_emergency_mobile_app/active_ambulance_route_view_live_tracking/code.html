<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Route View - FlashAid</title>
<!-- Tailwind CSS CDN with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for precise colors and fonts -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#EA3836',
              lightRed: '#FEECEB',
              dark: '#1D2129',
              muted: '#7A869A'
            },
            map: {
              bg: '#F3F4F6',
              road: '#FFFFFF',
              border: '#E2E5EB',
              text: '#94A3B8'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 -8px 30px -4px rgba(0, 0, 0, 0.08), 0 -2px 10px -2px rgba(0, 0, 0, 0.04)',
            'pill': '0 4px 14px rgba(234, 56, 54, 0.25)',
            'btn': '0 6px 16px rgba(234, 56, 54, 0.3)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Map Canvas and Vehicle Markers -->
<style data-purpose="map-styling">
    /* Subtle street-grid emulation */
    .map-background {
      background-color: #f7f9fa;
      background-image: 
        radial-gradient(#e4e7eb 1.5px, transparent 1.5px),
        linear-gradient(to right, #eceef2 1px, transparent 1px),
        linear-gradient(to bottom, #eceef2 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }

    /* Pulse animation for the live tracking ping */
    @keyframes location-pulse {
      0% {
        transform: scale(0.9);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.6);
        opacity: 0.15;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.7;
      }
    }

    .pulse-effect {
      animation: location-pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-neutral-900 flex justify-center items-center min-h-screen p-0 sm:p-4 select-none antialiased font-sans">
<!-- BEGIN: PhoneFrame -->
<!-- Mobile device shell matching iOS modern viewport proportions -->
<div class="relative w-full max-w-[393px] h-[844px] bg-white overflow-hidden sm:rounded-[48px] shadow-2xl flex flex-col justify-between border-[6px] border-neutral-900" data-purpose="mobile-container">
<!-- BEGIN: iOSStatusBar -->
<header class="absolute top-0 left-0 right-0 z-40 flex items-center justify-between px-7 pt-3 pb-2 text-black font-semibold text-[14px]" data-purpose="status-bar">
<!-- Time Display -->
<span>20:52</span>
<!-- Dynamic Island / Hardware cutout -->
<div class="w-28 h-6 bg-black rounded-full flex items-center justify-end px-2 space-x-1 -mt-0.5">
<div class="w-2.5 h-2.5 rounded-full bg-[#1a1a1a]"></div>
</div>
<!-- Right System Icons: Cellular, Wi-Fi, Battery -->
<div class="flex items-center space-x-1.5 text-black">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- Battery Icon with Percentage indicator '85' -->
<div class="flex items-center pl-1">
<div class="w-5 h-3 border border-black rounded-[4px] p-0.5 flex items-center relative">
<div class="h-full bg-black rounded-sm w-[85%]"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-black rounded-r-xs"></div>
</div>
<span class="text-[10px] ml-1 font-bold">85</span>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: MapSection -->
<!-- Interactive-like vector rendered road map simulation -->
<main class="relative w-full h-[66%] map-background overflow-hidden" data-purpose="map-view">
<!-- Top Navigation Header -->
<div class="absolute top-12 left-0 right-0 z-30 flex items-center px-5 pt-2">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-black/5 active:scale-95 transition-all text-neutral-900" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-base font-bold text-neutral-900 ml-3">Route View</h1>
</div>
<!-- SVG Map Canvas (Roads, Blocks, Route Line & Pins) -->
<svg class="absolute inset-0 w-full h-full" fill="none" viewbox="0 0 390 550" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Subtle shadow for building/zone layers -->
<filter height="110%" id="soft-shadow" width="110%" x="-5%" y="-5%">
<fedropshadow dx="0" dy="1" flood-color="#000" flood-opacity="0.04" stddeviation="1"></fedropshadow>
</filter>
</defs>
<!-- Land & Neighborhood Blobs -->
<path d="M-20 60 L140 30 L170 120 L-10 160 Z" fill="#F8F9FA"></path>
<path d="M180 20 L380 -10 L410 110 L190 140 Z" fill="#F8FAFC"></path>
<path d="M210 160 L400 130 L420 300 L230 310 Z" fill="#FAFBFD"></path>
<path d="M-10 240 L160 210 L180 390 L-10 420 Z" fill="#F8F9FA"></path>
<path d="M190 340 L410 320 L400 520 L210 500 Z" fill="#FAFBFD"></path>
<!-- Minor Street Network (Light Gray Lines) -->
<g stroke="#E8ECF2" stroke-linecap="round" stroke-linejoin="round">
<!-- A-Roads & Residential Lines -->
<line stroke="#FFFFFF" stroke-width="8" x1="-20" x2="420" y1="80" y2="40"></line>
<line stroke="#E2E7EE" stroke-opacity="0.6" stroke-width="10" x1="-20" x2="420" y1="80" y2="40"></line>
<line stroke="#FFFFFF" stroke-width="7" x1="80" x2="160" y1="0" y2="560"></line>
<line stroke="#E2E7EE" stroke-opacity="0.5" stroke-width="9" x1="80" x2="160" y1="0" y2="560"></line>
<line stroke="#FFFFFF" stroke-width="6" x1="160" x2="410" y1="120" y2="210"></line>
<line stroke="#E2E7EE" stroke-opacity="0.6" stroke-width="8" x1="160" x2="410" y1="120" y2="210"></line>
<line stroke="#FFFFFF" stroke-width="7" x1="-20" x2="420" y1="290" y2="230"></line>
<line stroke="#E2E7EE" stroke-opacity="0.5" stroke-width="9" x1="-20" x2="420" y1="290" y2="230"></line>
<line stroke="#FFFFFF" stroke-width="6" x1="60" x2="380" y1="360" y2="480"></line>
<line stroke="#E2E7EE" stroke-opacity="0.6" stroke-width="8" x1="60" x2="380" y1="360" y2="480"></line>
<!-- Diagonal Connectors -->
<path d="M120 70 L240 220 L310 400" fill="none" stroke="#FFFFFF" stroke-width="6"></path>
<path d="M120 70 L240 220 L310 400" fill="none" stroke="#E2E7EE" stroke-opacity="0.6" stroke-width="8"></path>
</g>
<!-- Map Typography / Street & Suburb Labels -->
<g fill="#9EA8B6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" letter-spacing="0.4">
<!-- Cyrillic & English Area Names based on IMAGE_13 -->
<text fill="#5F6C7B" font-size="9" font-weight="700" text-anchor="middle" x="100" y="160">ВУД ГРИН</text>
<text fill="#5F6C7B" font-size="8" font-weight="700" text-anchor="middle" x="100" y="171">WOOD GREEN</text>
<text font-size="7" text-anchor="start" transform="rotate(-15 160 195)" x="160" y="195">Lordship Ln</text>
<text fill="#5F6C7B" font-size="9" font-weight="700" text-anchor="middle" x="320" y="195">НОЭЛ ПАРК</text>
<text fill="#5F6C7B" font-size="8" font-weight="700" text-anchor="middle" x="320" y="206">NOEL PARK</text>
<text font-size="7" text-anchor="middle" transform="rotate(35 105 300)" x="105" y="300">Майерс-роуд</text>
<text font-size="7" text-anchor="middle" transform="rotate(-15 300 240)" x="300" y="240">Уэстбери-авеню</text>
<text fill="#EA3836" font-size="7" text-anchor="middle" transform="rotate(-25 120 275)" x="120" y="275">A109</text>
<text fill="#5F6C7B" font-size="9" font-weight="700" text-anchor="middle" x="105" y="505">ХОРНСИ</text>
<text fill="#5F6C7B" font-size="8" font-weight="700" text-anchor="middle" x="105" y="516">HORNSEY</text>
<text fill="#5F6C7B" font-size="8.5" font-weight="700" text-anchor="middle" x="330" y="475">ДАКЕТТС ГРИН</text>
<text fill="#5F6C7B" font-size="7.5" font-weight="700" text-anchor="middle" x="330" y="485">DUCKETT'S</text>
<text fill="#5F6C7B" font-size="7.5" font-weight="700" text-anchor="middle" x="330" y="495">GREEN</text>
<text font-size="7" text-anchor="middle" transform="rotate(-12 125 470)" x="125" y="470">Тернпайк-лэйн</text>
<text font-size="6.5" transform="rotate(-90 95 415)" x="95" y="415">B138</text>
</g>
<!-- Red Active Navigation Path / Route -->
<!-- Starts from user/patient pin and navigates down-right to the ambulance -->
<g>
<!-- Subtle glow under the route -->
<path d="M130 162 L112 170 L115 220 L152 278 L152 295 L170 330 L168 348 L150 445" stroke="#EA3836" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"></path>
<!-- Outer border for crisp rendering -->
<path d="M130 162 L112 170 L115 220 L152 278 L152 295 L170 330 L168 348 L150 445" stroke="#FF6B6A" stroke-dasharray="0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</g>
<!-- Patient Pin Location (Wood Green area) -->
<g transform="translate(129, 142)">
<!-- Pin Drop Shape -->
<path d="M0 0 C-5.5 0 -10 4.5 -10 10 C-10 17 0 26 0 26 C0 26 10 17 10 10 C10 4.5 5.5 0 0 0 Z" fill="#EA3836" filter="url(#soft-shadow)"></path>
<!-- White Center Inner Dot -->
<circle cx="0" cy="9.5" fill="#FFFFFF" r="4.5"></circle>
</g>
<!-- Ambulance Live Vehicle Marker -->
<g transform="translate(150, 475)">
<!-- Pulse radar wave -->
<circle class="pulse-effect" cx="0" cy="0" fill="#EA3836" r="28"></circle>
<!-- Vehicle Badge Outer Bubble -->
<g filter="url(#soft-shadow)">
<rect fill="#EA3836" height="46" rx="9" stroke="#FFFFFF" stroke-width="2.5" width="34" x="-17" y="-23"></rect>
<!-- Windshield -->
<rect fill="#D32F2F" height="9" rx="3" width="20" x="-10" y="-18"></rect>
<!-- White Medical Cross -->
<path d="M-2 -3 H2 V-7 H5 V-3 H9 V1 H5 V5 H2 V1 H-2 Z" fill="#FFFFFF" transform="translate(-1.5, 3)"></path>
</g>
</g>
</svg>
</main>
<!-- END: MapSection -->
<!-- BEGIN: ArrivalDashboardCard -->
<!-- Crisp white floating modal sheet with ETA progress and driver credentials -->
<section class="relative z-40 bg-white rounded-t-[32px] px-6 pt-5 pb-8 shadow-card border-t border-neutral-100 flex flex-col justify-between" data-purpose="arrival-card">
<!-- Card Drag Handle / Indicator -->
<div class="w-10 h-1 bg-neutral-200 rounded-full mx-auto mb-4"></div>
<!-- ETA Status & Live Horizontal Progress Indicator -->
<div class="mb-5" data-purpose="eta-status-block">
<div class="flex justify-between items-baseline mb-2.5">
<span class="text-[17px] font-bold text-neutral-900 tracking-tight">Arriving in</span>
<span class="text-[17px] font-bold text-brand-red tracking-tight">5 min</span>
</div>
<!-- Progress Track -->
<div class="relative w-full h-[3px] bg-neutral-100 rounded-full flex items-center">
<!-- Active Filled Route Bar -->
<div class="h-full bg-brand-red rounded-full w-[78%]"></div>
<!-- Moving Mini Ambulance Icon -->
<div class="absolute left-[78%] -translate-x-1/2 -top-2 flex items-center justify-center">
<div class="bg-brand-red text-white p-1 rounded-[5px] shadow-sm flex items-center justify-center">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M19 8h-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h1c0 1.66 1.34 3 3 3s3-1.34 3-3h4c0 1.66 1.34 3 3 3s3-1.34 3-3h1c.55 0 1-.45 1-1v-4.68c0-.52-.2-1.02-.57-1.39L19 8zm-8 4H9v2H7v-2H5v-2h2V8h2v2h2v2zm6 1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-9 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"></path>
</svg>
</div>
</div>
</div>
</div>
<!-- Driver Profile and Instant Communication Action Buttons -->
<div class="flex items-center justify-between pt-2" data-purpose="driver-info-block">
<!-- Paramedic Driver Identity -->
<div class="flex items-center space-x-3.5">
<!-- Circular Driver Avatar -->
<div class="relative">
<img alt="James Harris" class="w-[52px] h-[52px] rounded-full object-cover border-2 border-white shadow-sm ring-1 ring-neutral-200" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNk3XoC5luR1Wbc7g1uRkuXx2GAssgR00K5wnEE80GljfRM8ZbASbt7mKEi5VPHfZ2vN_y27Kj48vpyZU2T_E8RdS6mJ5iTl9EqnEG5RYJ6iXQ4xHJIyyGuxCyScwOugrv3uHSXHEPyPF9eSS51rjILMDTNjQRyAFq_nFKohFnAiLwLTMO3xEf3zbVg3KUAi6ajjpMP-YuZ-3c0BI8TIyzR9LtRo6IvwWVw4vl0YU"/>
</div>
<!-- Name & Designation -->
<div class="flex flex-col">
<h2 class="text-[17px] font-bold text-neutral-900 leading-tight">James Harris</h2>
<p class="text-[13px] text-neutral-400 font-medium mt-0.5">Ambulance Driver</p>
</div>
</div>
<!-- Action Buttons: Voice Call & Text Message -->
<div class="flex items-center space-x-3">
<!-- Call Button -->
<button aria-label="Call Ambulance Driver" class="w-[46px] h-[46px] rounded-full bg-brand-red text-white flex items-center justify-center shadow-btn active:scale-95 transition-transform hover:bg-[#d82e2c]" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-2.2 2.2a15.053 15.053 0 01-6.59-6.59l2.2-2.21a.96.96 0 00.25-1.01A11.36 11.36 0 018.57 3.9c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.52c0-.55-.45-1-.99-1z"></path>
</svg>
</button>
<!-- Chat / SMS Button -->
<button aria-label="Message Ambulance Driver" class="w-[46px] h-[46px] rounded-full bg-brand-red text-white flex items-center justify-center shadow-btn active:scale-95 transition-transform hover:bg-[#d82e2c]" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"></path>
</svg>
</button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-neutral-900 rounded-full mx-auto mt-7"></div>
</section>
<!-- END: ArrivalDashboardCard -->
</div>
<!-- END: PhoneFrame -->
</body></html>
