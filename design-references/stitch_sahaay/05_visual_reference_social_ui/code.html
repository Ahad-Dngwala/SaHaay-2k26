<!-- BEGIN: InteractiveTabScript -->
<script data-purpose="screen-switch-handlers">
    /**
     * Controls which screen(s) are highlighted or shown in responsive views
     */
    function switchScreen(view) {
      const feed = document.getElementById('screen-feed');
      const signin = document.getElementById('screen-signin');
      const players = document.getElementById('screen-players');
      
      const buttons = ['all', 'feed', 'signin', 'players'];
      buttons.forEach(b => {
        const btn = document.getElementById(`btn-${b}`);
        if (b === view) {
          btn.className = 'px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide transition-all bg-white text-black shadow';
        } else {
          btn.className = 'px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide text-white/70 hover:text-white transition-all';
        }
      });

      if (view === 'all') {
        feed.classList.remove('hidden');
        signin.classList.remove('hidden');
        players.classList.remove('hidden');
      } else if (view === 'feed') {
        feed.classList.remove('hidden');
        signin.classList.add('hidden');
        players.classList.add('hidden');
      } else if (view === 'signin') {
        feed.classList.add('hidden');
        signin.classList.remove('hidden');
        players.classList.add('hidden');
      } else if (view === 'players') {
        feed.classList.add('hidden');
        signin.classList.add('hidden');
        players.classList.remove('hidden');
      }
    }
  </script>
<!-- END: InteractiveTabScript -->
